<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protected Content - Sign in</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
    <style>
        .login-container {
            max-width: 500px;
            margin: 8rem auto;
            padding: 3rem;
            background: var(--color-paper);
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }
        .login-title {
            font-family: 'Newsreader', serif;
            font-size: 2rem;
            font-weight: 600;
            color: var(--color-ink);
            margin-bottom: 1rem;
            text-align: center;
        }
        .login-description {
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            color: var(--color-ink-light);
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-submit {
            display: block;
            width: 100%;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            padding: 1rem;
            background: var(--color-orbital);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: background-color 0.2s;
        }
        .login-submit:hover {
            background: #3a5f8a;
        }
        .error-message {
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            color: #d32f2f;
            text-align: center;
            padding: 0.75rem;
            background: #ffebee;
            border-radius: 6px;
            margin-bottom: 1rem;
        }
        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }
        .back-link a {
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            color: var(--color-orbital);
            text-decoration: none;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <main class="login-container">
        <h1 class="login-title">Protected Content</h1>
        <p class="login-description">
            Sign in with your Microsoft account to access private pages.
        </p>

        {% if error %}
        <div class="error-message" role="alert">{{ error }}</div>
        {% endif %}

        {% if login_url %}
        <a class="login-submit" href="{{ login_url }}">Continue with Microsoft</a>
        {% endif %}

        <div class="back-link">
            <a href="{{ url_for('index') }}">Back to Home</a>
        </div>
    </main>
</body>
</html>
